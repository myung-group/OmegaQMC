# Tier 3 validation: H2 at Weight 2024 (DMC) Fig 4 setting.
# omega_c = 5 eV, R = 2.8 Bohr, A0 = 0.5 a.u. -> lambda = 0.3031 (Tang convention)
# Weight uses: omega_c A0 (mu . e_hat) (a + a^dag) + omega_c A0^2 (mu . e_hat)^2
# Our convention: sqrt(omega/2) * lambda * (b+b^dag) (mu.e_hat) + (lambda^2/2) (mu.e_hat)^2
# Match: lambda = A0 * sqrt(2 * omega) [Hartree]

project: qed_h2_validate_weight_R28_A0_05

seed: 42

system:
  type: h2
  R_bohr: 2.8
  spin: singlet

cavity:
  omega: 0.18373   # 5 eV in Hartree
  lambda: 0.3031
  polarization: [0.0, 0.0, 1.0]

ansatz:
  type: OmegaQMC/psi/nn/conf/ferminet_jastrow.yaml

optimizer:
  arch: tang_native
  alpha_init: 0.0
  alpha_train: false
  nph_max: 6

  train:
    num_iters: 2000
    num_walkers: 256
    num_steps_per_block: 30
    num_blocks_equil: 5
    num_steps_decorr: 5
    mc_timestep: 0.1
    lr: 0.05
    damping: 1e-3
    cg_maxiter: 100
    max_param_change: 0.5
    jac_batch_size: 64
    verbose: 1

  eval:
    enabled: true
    num_walkers: 512
    num_steps_per_block: 30
    num_blocks: 30
    num_blocks_equil: 10
    mc_timestep: 0.1
    verbose: 0
