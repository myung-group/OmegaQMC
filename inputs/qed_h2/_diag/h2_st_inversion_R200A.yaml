# =====================================================================
# Focused S-T inversion test at R = 2.0 Angstrom = 3.7795 Bohr.
#
# Chosen because vacuum S-T gap there is small (~18 mHa, FCI), so any
# cavity-induced shift has the best chance of inverting the ordering.
#
# Single template — system.spin and cavity.lambda are overridden by
# the launcher to produce the 4 grid points
#   (singlet, triplet) x (lambda=0 baseline, lambda=0.5 large coupling).
# Polarization is circularly polarized in the (x, y) plane perpendicular
# to the H-H axis (along z).
#
# Budget is "medium" — 500 iters x 256 walkers — large enough that
# absolute energies are within ~5 mHa of converged, so a S-T gap
# difference of ~10 mHa is statistically resolvable.
# =====================================================================

project: PROJECT_OVERRIDE

seed: 42

system:
  type: h2
  R_bohr: 3.7795
  spin: SPIN_OVERRIDE

cavity:
  omega: 0.5
  lambda: LAMBDA_OVERRIDE
  polarization:   [1.0, 0.0, 0.0]
  polarization_y: [0.0, 1.0, 0.0]
  chiral_handedness: 1

ansatz:
  type: OmegaQMC/psi/nn/conf/ferminet_jastrow_complex.yaml

optimizer:
  arch: tang_native
  complex_psi: true
  alpha_init: 0.0
  alpha_train: false
  nph_max: 4

  train:
    num_iters: 500
    num_walkers: 256
    num_steps_per_block: 30
    num_blocks_equil: 5
    num_steps_decorr: 5
    mc_timestep: 0.1
    lr: 0.05
    damping: 1e-3
    cg_maxiter: 100
    max_param_change: 0.5
    jac_batch_size: 64
    verbose: 1

  eval:
    enabled: true
    num_walkers: 512
    num_steps_per_block: 30
    num_blocks: 30
    num_blocks_equil: 10
    mc_timestep: 0.1
    verbose: 1
