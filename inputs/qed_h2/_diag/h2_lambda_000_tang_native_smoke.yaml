# =====================================================================
# Local smoke test: λ=0 sanity for Tang-native ansatz on FermiNet+Jastrow+backflow.
#
# Purpose: confirm that with λ=0 (decoupled cavity), the Tang-native
# ansatz reduces to the bare H2 electronic ground state. The optimizer
# should drive E_VMC toward -1.174 Ha (FCI minimal basis is around
# -1.137 Ha, complete-basis-limit is around -1.1745 Ha; our minimal NN
# trial converges in the -1.10 to -1.16 range with this small budget).
#
# Budget kept tiny so it runs locally on bohr GPU (12 GB) in <2 min;
# this is a *wiring* check, not a production accuracy run.
#
# Run: python scripts/run_qed_vmc.py inputs/qed_h2/_diag/h2_lambda_000_tang_native_smoke.yaml
# =====================================================================

project: qed_h2_lambda000_tang_native_smoke

seed: 42

system:
  type: h2
  R_bohr: 1.4010

cavity:
  omega: 0.5
  lambda: 0.0
  polarization: [0.0, 0.0, 1.0]

ansatz:
  # Path to custom FermiNet+Jastrow+backflow preset (see
  # OmegaQMC/psi/nn/conf/ferminet_jastrow.yaml). The Tang-native factory
  # forces project_to_embedding_dim=true and qed_nph_max=nph_max
  # internally, so we don't need to set those here.
  type: OmegaQMC/psi/nn/conf/ferminet_jastrow.yaml

optimizer:
  arch: tang_native
  alpha_init: 0.0
  alpha_train: false
  nph_max: 4

  train:
    num_iters: 50
    num_walkers: 32
    num_steps_per_block: 30
    num_blocks_equil: 5
    num_steps_decorr: 5
    mc_timestep: 0.1
    lr: 0.05
    damping: 1e-3
    cg_maxiter: 100
    max_param_change: 0.5
    jac_batch_size: 16
    verbose: 1

  eval:
    enabled: true
    num_walkers: 64
    num_steps_per_block: 30
    num_blocks: 10
    num_blocks_equil: 5
    mc_timestep: 0.1
    verbose: 0
