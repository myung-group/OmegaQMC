# =====================================================================
# QED-NN-VMC pilot: H2 at λ=0.1 with Tang-native ansatz (Phase 2g).
# Target: ΔE_VMC ≈ -5 mHa relative to bare H2 ground state, comparing
# against QED-FCI/aug-cc-pVDZ ΔE = -5.95 mHa (proper DSE, ω=0.5 Ha).
#
# Architecture:
#   - Per-electron one-hot(n) injected into FermiNet+Jastrow+backflow
#     GNN body (Tang 2025 Sec. II.C). Native Slater determinant sign.
#     No coherent-state envelope; no external Fock head.
#
# Compute target: mango GH200 (96 GB).
# =====================================================================

project: qed_h2_lambda_010_tang_native_2000_mango

seed: 42

system:
  type: h2
  R_bohr: 1.4010

cavity:
  omega: 0.5
  lambda: 0.1
  polarization: [0.0, 0.0, 1.0]

ansatz:
  type: OmegaQMC/psi/nn/conf/ferminet_jastrow.yaml

optimizer:
  arch: tang_native
  alpha_init: 0.0
  alpha_train: false
  nph_max: 4

  train:
    num_iters: 2000
    num_walkers: 256
    num_steps_per_block: 30
    num_blocks_equil: 5
    num_steps_decorr: 5
    mc_timestep: 0.1
    lr: 0.05
    damping: 1e-3
    cg_maxiter: 100
    max_param_change: 0.5
    jac_batch_size: 64
    verbose: 1

  eval:
    enabled: true
    num_walkers: 512
    num_steps_per_block: 30
    num_blocks: 30
    num_blocks_equil: 10
    mc_timestep: 0.1
    verbose: 0
