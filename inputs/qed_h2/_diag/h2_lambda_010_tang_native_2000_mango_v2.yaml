# =====================================================================
# QED-NN-VMC closing pilot: H2 at λ=0.1, ω=0.5 with Tang-native ansatz.
#
# Run AFTER the qed_fci DSE 1-body Wick-double-count fix
# (commit 4b422a5). Generates the final NN-VMC number for the
# side-by-side comparison vs corrected QED-FCI (+4.60 mHa) and
# perturbative HF-DSE prediction.
#
# Architecture:
#   - Per-electron one-hot(n) into FermiNet+Jastrow+backflow GNN body
#     (Tang 2025 Sec. II.C). Native Slater determinant sign.
#
# Compute target: mango GH200 (96 GB), ~5 min train + 1 min eval.
# =====================================================================

project: qed_h2_lambda_010_tang_native_2000_mango_v2

seed: 42

system:
  type: h2
  R_bohr: 1.4010

cavity:
  omega: 0.5
  lambda: 0.1
  polarization: [0.0, 0.0, 1.0]

ansatz:
  type: OmegaQMC/psi/nn/conf/ferminet_jastrow.yaml

optimizer:
  arch: tang_native
  alpha_init: 0.0
  alpha_train: false
  nph_max: 4

  train:
    num_iters: 2000
    num_walkers: 256
    num_steps_per_block: 30
    num_blocks_equil: 5
    num_steps_decorr: 5
    mc_timestep: 0.1
    lr: 0.05
    damping: 1e-3
    cg_maxiter: 100
    max_param_change: 0.5
    jac_batch_size: 64
    verbose: 1

  eval:
    enabled: true
    num_walkers: 512
    num_steps_per_block: 30
    num_blocks: 30
    num_blocks_equil: 10
    mc_timestep: 0.1
    verbose: 0
