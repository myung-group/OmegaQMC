# =====================================================================
# QED-NN-VMC: H2 at λ=0.1 with Tang-style n-aware ansatz (Phase 2f-1)
#
# Companion to h2_decoupling_pilot_naware. The differential
# ΔE(λ=0.1) − ΔE(λ=0) of these two pilots should match QED-FCI's
# −4.251 mHa (within MC stderr + basis-set residual) — the factorized
# ansatz gave +8.42 mHa (sign error). Phase 2f-1 must restore the
# correct sign and approximate magnitude.
#
# QED-FCI reference (STO-6G): E(λ=0.1) − E(λ=0) = −4.251 mHa.
# =====================================================================

project: qed_h2_lambda_010_naware

seed: 42

system:
  type: h2
  R_bohr: 1.4010

cavity:
  omega: 0.5
  lambda: 0.1
  polarization: [0.0, 0.0, 1.0]   # along H-H axis (εz)

ansatz:
  type: psiformer

optimizer:
  n_aware: true            # Phase 2f-1 — Tang-style joint (r, n) ansatz
  fock_hidden_dim: 64
  alpha_init: 0.0          # ignored when n_aware=true
  alpha_train: false
  nph_max: 6

  train:
    num_iters: 100
    num_walkers: 256
    num_steps_per_block: 30
    num_blocks_equil: 5
    num_steps_decorr: 5
    mc_timestep: 0.1
    lr: 0.05
    damping: 1e-3
    cg_maxiter: 100
    max_param_change: 0.5
    jac_batch_size: 64
    verbose: 1

  eval:
    enabled: true
    num_walkers: 512
    num_steps_per_block: 30
    num_blocks: 30
    num_blocks_equil: 10
    mc_timestep: 0.1
    verbose: 0
