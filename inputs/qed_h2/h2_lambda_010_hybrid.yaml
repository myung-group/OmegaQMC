# =====================================================================
# QED-NN-VMC: H2 at λ=0.1 with hybrid envelope + Fock-head ansatz
# (Phase 2f-1 Path B)
#
# Companion to h2_decoupling_pilot_hybrid (matched seed and α_init).
# Differential ΔE(λ=0.1) − ΔE(λ=0) target: −4.25 mHa from QED-FCI/STO-6G.
# =====================================================================

project: qed_h2_lambda_010_hybrid

seed: 42

system:
  type: h2
  R_bohr: 1.4010

cavity:
  omega: 0.5
  lambda: 0.1
  polarization: [0.0, 0.0, 1.0]

ansatz:
  type: psiformer

optimizer:
  arch: hybrid
  fock_hidden_dim: 64
  alpha_init: 0.1
  alpha_train: true
  nph_max: 6

  train:
    num_iters: 100
    num_walkers: 256
    num_steps_per_block: 30
    num_blocks_equil: 5
    num_steps_decorr: 5
    mc_timestep: 0.1
    lr: 0.05
    damping: 1e-3
    cg_maxiter: 100
    max_param_change: 0.5
    jac_batch_size: 64
    alpha_lr_scale: 2.0
    verbose: 1

  eval:
    enabled: true
    num_walkers: 512
    num_steps_per_block: 30
    num_blocks: 30
    num_blocks_equil: 10
    mc_timestep: 0.1
    verbose: 0
