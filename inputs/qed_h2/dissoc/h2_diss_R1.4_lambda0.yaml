# H2 dissociation Phase A: lambda=0 baseline at R = 1.4 Bohr.
# tang_native ansatz, 256 walkers x 2000 SR iters.
# Reference: QED-FCI/aug-cc-pVDZ (logs/h2_dissoc/fci_baseline.csv).

project: qed_h2_diss_R1.4_lambda0

seed: 42

system:
  type: h2
  R_bohr: 1.4

cavity:
  omega: 0.46672
  lambda: 0.0
  polarization: [0.0, 0.0, 1.0]

ansatz:
  type: OmegaQMC/psi/nn/conf/ferminet_jastrow.yaml

optimizer:
  arch: tang_native
  alpha_init: 0.0
  alpha_train: false
  nph_max: 4

  train:
    num_iters: 2000
    num_walkers: 256
    num_steps_per_block: 30
    num_blocks_equil: 5
    num_steps_decorr: 5
    mc_timestep: 0.1
    lr: 0.05
    damping: 1e-3
    cg_maxiter: 100
    max_param_change: 0.5
    jac_batch_size: 64
    verbose: 1

  eval:
    enabled: true
    num_walkers: 512
    num_steps_per_block: 30
    num_blocks: 30
    num_blocks_equil: 10
    mc_timestep: 0.1
    verbose: 0
