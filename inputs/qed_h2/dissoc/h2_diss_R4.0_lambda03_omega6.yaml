# H2 dissociation Phase B (small cut): lambda=0.3, omega=6 eV at R = 4.0 Bohr.
# omega=6 eV chosen so the |g,1> <-> |e,0> crossing falls at intermediate R
# (where dE_eg(R) = omega = 6 eV). Hunt for polariton-induced features.

project: qed_h2_diss_R4.0_lambda03_omega6

seed: 42

system:
  type: h2
  R_bohr: 4.0
  spin: singlet

cavity:
  omega: 0.22043   # 6 eV in Hartree
  lambda: 0.3
  polarization: [0.0, 0.0, 1.0]   # along bond axis (sigma_g -> sigma_u dipole-allowed)

ansatz:
  type: OmegaQMC/psi/nn/conf/ferminet_jastrow.yaml

optimizer:
  arch: tang_native
  alpha_init: 0.0
  alpha_train: false
  nph_max: 6   # bumped at strong coupling

  train:
    num_iters: 2000
    num_walkers: 256
    num_steps_per_block: 30
    num_blocks_equil: 5
    num_steps_decorr: 5
    mc_timestep: 0.1
    lr: 0.05
    damping: 1e-3
    cg_maxiter: 100
    max_param_change: 0.5
    jac_batch_size: 64
    verbose: 1

  eval:
    enabled: true
    num_walkers: 512
    num_steps_per_block: 30
    num_blocks: 30
    num_blocks_equil: 10
    mc_timestep: 0.1
    verbose: 0
