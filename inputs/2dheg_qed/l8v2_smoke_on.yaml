# L8 V2 (Tang) end-to-end smoke — 20 iters, small walker count.
# Tests that train + eval loop runs cleanly with the Tang trunk.
# Do NOT use the energy from this as a physical result.
project: l8v2_smoke_on

system:
  n_up: 9
  n_down: 9
  rs: 1.5958
  dim: 2
  include_vee: false

v_ext:
  amp: 0.3
  a: 3.0

cavity:
  omega: 0.1
  lambda: 0.02357
  polarization: [1.0, 0.0]
  coupling_op: P
  N_max: 4
  phase_mlp_hidden: [64, 64]
  offset_floor: -50.0

ansatz:
  backbone: ferminet
  embedding_dim: 64
  n_interactions: 3
  two_particle_stream_dim: 16
  n_det: 1
  full_determinant: true
  use_backflow: true
  use_cusp: true
  n_virt_pw: 0
  use_ghost_atom: true
  use_deep_jastrow: false
  use_smith_deep_jastrow: true
  envelope_type: plane_wave

optimize:
  lr: 0.005
  sr_damping: 1.0e-3
  sr_n_cg: 20
  iters: 20            # SMOKE — short
  walkers: 128         # SMOKE — small
  mcmc_decorr_steps: 5
  mc_timestep_R: 0.1
  equil_steps: 20
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_T_max: 20
  spring_mu: 0.0
  spring_norm_clip: 1.0e10
  save_every: 0

ewald:
  n_real: 2
  n_recip: 4

eval:
  walkers: 128
  blocks: 0            # skip eval in smoke
  equil_blocks: 0
  steps_per_block: 10

observables:
  enabled: false

seed: 42
