# Phase 5c step 2: L5 at rs=50 N=50 λ=0.
# Matched to bare_rs50_N50_match_l5.yaml: deep_jastrow on, n_virt_pw=0,
# SPRING (mu=0.9, clip=0.1), 1000 iters.
# Expected target (Weber): bare_HEG/N + Ω/(2·N_e)
#                        = E_bare + 0.1/(2·50) = E_bare + 1.0 mHa

project: l5_lambda0_rs50_N50

system:
  n_up: 25
  n_down: 25
  rs: 50.0
  dim: 2

cavity:
  omega: 0.1
  lambda: 0.0
  polarization: [1.0, 0.0]
  K_max: 3
  phase_mlp_hidden: [32, 32]
  mag_mlp_hidden: [32, 32]
  activation: tanh

ansatz:
  backbone: ferminet
  embedding_dim: 32
  n_interactions: 1
  two_particle_stream_dim: 8
  n_det: 2
  full_determinant: true
  use_backflow: true
  use_cusp: true
  n_virt_pw: 0
  use_ghost_atom: true                 # required by crystal_gaussian
  use_deep_jastrow: true
  envelope_type: crystal_gaussian      # WC inductive bias (electrons only)
  crystal_sigma_init: 0.10
  crystal_spin_pattern: neel
  crystal_det_jitter: 0.10

optimize:
  use_smw_sr: true
  use_fused_step: true
  freeze_mlps: false
  lr: 1.0                       # matched to bare HEG SPRING recipe
  sr_damping: 1.0e-3
  sr_n_cg: 20
  iters: 500
  walkers: 1024
  mcmc_decorr_steps: 15         # matched to bare HEG
  mc_timestep_R: 0.1            # matched to bare HEG
  mc_timestep_qc: 0.5           # back to L5 default
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_T_max: 500
  spring_mu: 0.9
  spring_norm_clip: 0.1
  save_every: 500             # checkpoint every 500 iters (npz)

ewald:
  n_real: 2
  n_recip: 4

eval:
  walkers: 1024
  blocks: 20
  equil_blocks: 5
  steps_per_block: 10

observables:
  enabled: true
  triangular_shells: 2
  cartesian_n_max: 4
  n_walkers: 1024
  sample_steps: 200
  decorr_steps: 5
  density_2d: true           # 2D density-map plot in run_dir
  density_n_bins: 64

seed: 42
