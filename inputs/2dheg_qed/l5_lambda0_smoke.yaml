# Level 5 regression smoke: rs=10, N=26, λ=0.
#
# Expected at λ=0:
#   • MLP_mag, MLP_phase weights stay near 0 (no force on them at λ=0
#     since polariton bilinear is zero).
#   • Trial → bare HEG · HO photon Gaussian.
#   • E_QED/N = E_bare_HEG + Ω/2  ≈  −84.66 + 1.92  =  −82.74 mHa
#     (matches Step 5 λ=0 result to MCMC noise).
#   • ⟨q_c²⟩ = 1/(2Ω) = 5.0  (HO ground state).
#   • ⟨Im E_loc⟩/N → 0 (Hermiticity).

project: l5_lambda0_smoke

system:
  # Smaller system for fast regression: closed-shell 2D HEG N=10
  # (n_up=5, n_down=5).  Tests the L5 stack end-to-end without the
  # cost of N=26.
  n_up: 5
  n_down: 5
  rs: 10.0
  dim: 2

cavity:
  omega: 0.1
  lambda: 0.0
  polarization: [1.0, 0.0]
  # Smaller K cutoff for speed: K_max=3 → ~24 K vectors → 49 features
  K_max: 3
  phase_mlp_hidden: [32, 32]
  mag_mlp_hidden: [32, 32]
  activation: tanh

ansatz:
  # Small but expressive enough for HEG @ rs=10 to reach ~-85 mHa:
  # backbone + backflow + cusp.  Skipping deep Jastrow (less impact).
  backbone: ferminet
  embedding_dim: 32
  n_interactions: 1
  two_particle_stream_dim: 8
  n_det: 2
  full_determinant: true
  use_backflow: true
  use_cusp: true

optimize:
  lr: 1.0
  sr_damping: 1.0e-3
  sr_n_cg: 20
  iters: 500
  walkers: 512
  mcmc_decorr_steps: 15
  mc_timestep_R: 0.1
  mc_timestep_qc: 0.5
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_T_max: 500
  spring_mu: 0.9
  spring_norm_clip: 0.1

ewald:
  n_real: 2
  n_recip: 4

eval:
  walkers: 256
  blocks: 20
  equil_blocks: 3
  steps_per_block: 10

seed: 42
