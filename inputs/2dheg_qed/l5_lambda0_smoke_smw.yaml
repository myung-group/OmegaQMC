# Level 5 regression smoke (SMW dual-form SR — plan B).
# Same ansatz + MCMC as l5_lambda0_smoke.yaml.  Only the SR solver
# changed: primal-CG → SMW.  Target: match bare HEG control
#     E_bare/N + Ω/2 = −84.80 + 1.92 = −82.88 mHa
# at ~0.4 s/iter (vs 3.5 s/iter for CG).

project: l5_lambda0_smoke_smw

system:
  n_up: 5
  n_down: 5
  rs: 10.0
  dim: 2

cavity:
  omega: 0.1
  lambda: 0.0
  polarization: [1.0, 0.0]
  K_max: 3
  phase_mlp_hidden: [32, 32]
  mag_mlp_hidden: [32, 32]
  activation: tanh

ansatz:
  backbone: ferminet
  embedding_dim: 32
  n_interactions: 1
  two_particle_stream_dim: 8
  n_det: 2
  full_determinant: true
  use_backflow: true
  use_cusp: true
  # Match bare HEG control's minimal envelope (no virt PWs, no ghost atom)
  n_virt_pw: 0
  use_ghost_atom: false

optimize:
  use_smw_sr: true            # plan B: exact walker-space SMW solve
  lr: 1.0
  sr_damping: 1.0e-3
  sr_n_cg: 20                 # ignored when use_smw_sr=true
  iters: 500
  walkers: 512
  mcmc_decorr_steps: 15
  mc_timestep_R: 0.1
  mc_timestep_qc: 0.5
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_T_max: 500
  spring_mu: 0.9
  spring_norm_clip: 0.1

ewald:
  n_real: 2
  n_recip: 4

eval:
  walkers: 256
  blocks: 20
  equil_blocks: 3
  steps_per_block: 10

seed: 42
