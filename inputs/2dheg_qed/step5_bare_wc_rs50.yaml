# Step 5 bare-WC baseline: rs=50, N=42, no cavity coupling.
#
# Validates that the crystal trial wavefunction (crystal_gaussian
# envelope + crystal_perturbed walker init) trains correctly with
# the new Step 5 optimizer.  Cavity machinery is present (Ω>0,
# nph_max>0) but coupling is off (λ=0) — diamag and paramag vanish.
#
# N=42 = 21+21 (closed-shell unpolarized for 2D plane-wave momentum
# basis).  At rs=50 we're deep in the WC phase (DMC rs_c ≈ 30-37).

project: step5_bare_wc_rs50_n42

system:
  dim: 2
  rs: 50.0
  N: 42
  polarization: unpolarized

cavity:
  omega: 0.1
  nph_max: 4
  lambda: 0.0
  polarization: [1.0, 0.0]

ansatz:
  type: nn_heg
  backbone: ferminet
  embedding_dim: 128
  layers: 3
  two_particle_dim: 16
  n_det: 8
  full_determinant: true
  use_cusp: true
  cusp_trainable_alpha: false
  pair_jastrow: false
  deep_jastrow: false
  use_smith_deep_jastrow: true
  smith_jastrow_hidden: 32
  smith_jastrow_n_layers: 4
  use_backflow: true
  use_coord_backflow: false
  use_ghost_atom: false
  envelope_type: crystal_gaussian
  crystal_sigma_init: 0.25
  crystal_spin_pattern: neel
  n_virt_pw: 0
  det_jitter: 0.04
  walker_init: crystal_perturbed

pretrain:
  iters: 0

optimize:
  type: sr
  iters: 500
  walkers: 1024
  lr: 1.0
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_T_max: 500
  spring_mu: 0.9
  spring_norm_clip: 0.1
  damping_adapt: false
  sampler: metropolis
  var_weight: 0.0
  mcmc_decorr_steps: 20
  mc_timestep: 0.1
  sr_damping: 1.0e-3
  sr_n_cg: 20
  save_every: 0

eval:
  walkers: 512
  blocks: 50
  equil_blocks: 10
  steps_per_block: 20

observables:
  enabled: true
  # Triangular reciprocal lattice (rs-rescaled).  n_shell=3 gives ~30
  # K vectors covering first 3 shells; first shell at |G|·rs = 4.18.
  triangular_shells: 3
  # Cartesian grid in reciprocal space, n_max in units of 2π/L per axis.
  # |k|_max = n_max·2π/L; for L=574 Bohr, n_max=10 reaches |k| ≈ 0.11.
  cartesian_n_max: 10
  n_walkers: 512
  equil_steps: 200
  sample_steps: 100
  decorr_steps: 5

twist:
  n_twists: 0

ewald:
  n_real: 3
  n_recip: 6
