# L8 V2 (Tang) — aggressive optimizer attempt to escape vacuum local-min.
#
# Diagnosis from l8v2_on (the first 30k-iter run): trial converged to pure
# Fock vacuum (⟨n⟩=0, p_0=1.0, phase_mlp last layer still ~zero).  E_corr
# was −0.029 mHa/e vs V11's −0.225 — Tang failed to discover the LF
# coherent-state mean field on its own.
#
# Changes vs l8v2_on.yaml (everything else identical):
#   offset_floor:    -5.0   → -2.0    (init |ψ_{n>0}|/|ψ_0| = exp(-2) ≈ 0.135 — much
#                                       stronger gradient signal for n-conditioning)
#   lr:              0.005  → 0.02    (4× larger — escape vacuum basin)
#   spring_mu:       0.0    → 0.9     (momentum on; helps climb out of flat regions)
#   spring_norm_clip:1e10   → 0.1     (F-norm clip; standard SPRING recipe to keep
#                                       updates bounded under aggressive lr+momentum)
#
# Risk: aggressive settings may destabilize.  If E blows up early, kill and
# soften (lr=0.01 or mu=0.7).  If E descends but ⟨n⟩ stays at 0, the
# architecture genuinely can't reach LF in our SR setup.
project: l8v2_on_aggressive

system:
  n_up: 9
  n_down: 9
  rs: 1.5958
  dim: 2
  include_vee: false

v_ext:
  amp: 0.3
  a: 3.0

cavity:
  omega: 0.1
  lambda: 0.02357
  polarization: [1.0, 0.0]
  coupling_op: P
  N_max: 2
  phase_mlp_hidden: [64, 64]
  offset_floor: -2.0         # was -5

ansatz:
  backbone: ferminet
  embedding_dim: 64
  n_interactions: 3
  two_particle_stream_dim: 16
  n_det: 1
  full_determinant: true
  use_backflow: true
  use_cusp: true
  n_virt_pw: 0
  use_ghost_atom: true
  use_deep_jastrow: false
  use_smith_deep_jastrow: true
  envelope_type: plane_wave

optimize:
  lr: 0.02                   # was 0.005
  sr_damping: 1.0e-3
  sr_n_cg: 20
  iters: 30000
  walkers: 2048
  mcmc_decorr_steps: 15
  mc_timestep_R: 0.1
  equil_steps: 50
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_T_max: 30000
  spring_mu: 0.9             # was 0.0  — SPRING momentum on
  spring_norm_clip: 0.1      # was 1e10 — F-norm clip on
  save_every: 1000
  use_fused_step: true

ewald:
  n_real: 2
  n_recip: 4

eval:
  walkers: 2048
  blocks: 50
  equil_blocks: 5
  steps_per_block: 10

observables:
  enabled: false

seed: 42
