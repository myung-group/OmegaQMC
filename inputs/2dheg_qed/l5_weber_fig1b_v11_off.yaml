# V11 OFF — L7 architecture with Smith deep Jastrow + Q0 + P0
# Cavity OFF baseline (lambda=0).  Two real changes vs V10:
#   1. use_smith_deep_jastrow now actually flows into HEGPsiFormerConfig
#      (driver bug discovered during V10 Q0 inspection — the flag was
#      read but never passed to the ansatz constructor; all v8-v10
#      runs trained without it).
#   2. L7 photon ansatz adds an explicit i*P0(R)*q_c phase term.  For
#      coupling_op="P" (canonical-momentum coupling) this is the
#      Lang-Firsov mean-field channel that Q0 (a real position shift)
#      cannot reach.  At lambda=0 both Q0 and P0 see no driving signal,
#      so the OFF run mainly validates that:
#        a. V_ee=off + smith_DJ matter still converges to HF;
#        b. Q0, P0 stay near init (zero-driving).
project: l5_weber_fig1b_v11_off

system:
  n_up: 9
  n_down: 9
  rs: 1.5958              # = L/sqrt(N pi) for L=12 N=18 (closed shell)
  dim: 2
  include_vee: false

v_ext:
  amp: 0.3
  a: 3.0

cavity:
  omega: 0.1
  lambda: 0.0             # cavity OFF baseline (= HF for non-interacting matter)
  polarization: [1.0, 0.0]
  coupling_op: P
  K_max: 6
  phase_mlp_hidden: [64, 64]
  mag_mlp_hidden: [64, 64]
  activation: tanh
  use_matter_photon_shift: true     # L6 Q0(R)
  use_matter_photon_width: false
  use_matter_photon_pshift: true    # L7 P0(R)*q_c — the LF channel for coupling_op=P
  q0_mlp_hidden: [32, 32]
  s_mlp_hidden: [32, 32]
  p0_mlp_hidden: [32, 32]

ansatz:
  backbone: ferminet
  embedding_dim: 64
  n_interactions: 3
  two_particle_stream_dim: 16
  n_det: 1
  full_determinant: true
  use_backflow: true
  use_cusp: true
  n_virt_pw: 0
  use_ghost_atom: true
  use_deep_jastrow: false
  use_smith_deep_jastrow: true   # now actually applied (driver bug fixed)
  envelope_type: plane_wave

optimize:
  use_smw_sr: true
  use_fused_step: true
  freeze_mlps: false
  lr: 0.005
  sr_damping: 1.0e-3
  sr_n_cg: 20
  iters: 30000
  walkers: 2048
  mcmc_decorr_steps: 15
  mc_timestep_R: 0.1
  mc_timestep_qc: 0.5
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_T_max: 30000
  spring_mu: 0.0
  spring_norm_clip: 1.0e10
  save_every: 1000

ewald:
  n_real: 2
  n_recip: 4

eval:
  walkers: 2048
  blocks: 50
  equil_blocks: 5
  steps_per_block: 10

observables:
  enabled: false

seed: 42
