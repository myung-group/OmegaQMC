# Ablation diagnostic at rs=20 N=18: turn OFF Smith deep Jastrow
# AND coord backflow.  Keep cusp + bare plane-wave Slater + Smith
# orbital coefficients (those are needed for the determinant).
#
# Purpose: isolate which component is responsible for our observed
# descent below DMC at rs=20.
#
#   - cusp + bare Slater can't easily develop singularities; energy
#     should plateau at ~HF + cusp gain ≈ -33 to -35 mHa.
#   - If this plateaus at ~-47 mHa (the same pathology), the bug is
#     in the bare ansatz / orbital determinant logic.
#   - If this plateaus at ~-33 mHa as expected, the pathology is in
#     the deep Jastrow or coord backflow components.
#
# Same optimizer recipe as rs20_n18_lite_vanilla (vanilla SR +
# Metropolis + cosine lr) for direct comparison.

project: rs20_n18_ablation_no_dj_no_bf

system:
  dim: 2
  rs: 20.0
  N: 18
  polarization: unpolarized

ansatz:
  type: nn_heg
  backbone: mpnqs
  mpnqs_d1: 24
  mpnqs_d2: 16
  mpnqs_hidden: 24
  mpnqs_n_layers: 3
  n_det: 1
  full_determinant: false
  use_cusp: true
  cusp_trainable_alpha: false       # locked
  pair_jastrow: false
  deep_jastrow: false
  use_smith_deep_jastrow: false     # ABLATED OFF
  smith_jastrow_hidden: 24
  smith_jastrow_n_layers: 3
  use_backflow: false
  use_coord_backflow: false         # ABLATED OFF
  coord_bf_zero_init: true
  use_ghost_atom: false
  envelope_type: plane_wave
  n_virt_pw: 45
  det_jitter: 0.05
  walker_init: crystal_perturbed

pretrain:
  iters: 0

optimize:
  type: sr
  iters: 8000
  walkers: 1024
  lr: 0.05
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_T_max: 8000
  lr_n_restarts: 0
  spring_mu: 0.0
  spring_norm_clip: 0
  damping_adapt: false
  sampler: metropolis
  var_weight: 0.0
  mcmc_decorr_steps: 30
  mc_timestep: 0.1
  sr_damping: 1.0e-3
  sr_n_cg: 20
  save_every: 500

eval:
  walkers: 1024
  blocks: 50
  equil_blocks: 20
  steps_per_block: 30

observables:
  enabled: false                    # not needed for this diagnostic

twist:
  n_twists: 0

ewald:
  n_real: 3
  n_recip: 6
