# Bare 2D HEG control at rs=50 N=50 — true triangular WC patch
# (N=50 = 2·5² magic number, M=5 super-rectangle).

project: bare_rs50_N50_match_l5

system:
  dim: 2
  rs: 50.0
  N: 50
  polarization: unpolarized

ansatz:
  type: nn_heg
  backbone: ferminet
  embedding_dim: 32
  layers: 1
  two_particle_dim: 8
  n_det: 2
  full_determinant: true
  use_cusp: true
  cusp_trainable_alpha: false
  use_backflow: true
  use_coord_backflow: false
  pair_jastrow: false
  deep_jastrow: true            # turned on for N=50
  use_smith_deep_jastrow: false
  use_ghost_atom: true          # required by crystal_gaussian envelope
  envelope_type: crystal_gaussian   # WC inductive bias (vs plane_wave)
  crystal_sigma_init: 0.10
  crystal_spin_pattern: neel
  crystal_det_jitter: 0.10
  n_virt_pw: 0
  det_jitter: 0.04
  walker_init: crystal_perturbed

pretrain:
  iters: 0

optimize:
  type: sr
  iters: 500
  walkers: 1024
  lr: 1.0
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_T_max: 500
  spring_mu: 0.9            # SPRING restored
  spring_norm_clip: 0.1     # F-norm clip (option A)
  damping_adapt: false
  sampler: metropolis
  var_weight: 0.0
  mcmc_decorr_steps: 15
  mc_timestep: 0.1
  sr_damping: 1.0e-3
  sr_n_cg: 20
  save_every: 500

eval:
  walkers: 1024
  blocks: 20
  equil_blocks: 5
  steps_per_block: 10

observables:
  enabled: true
  triangular_shells: 2
  cartesian_n_max: 4
  n_walkers: 1024
  equil_steps: 200
  sample_steps: 200
  decorr_steps: 5

twist:
  n_twists: 0

ewald:
  n_real: 2
  n_recip: 4

seed: 42                       # different seed for diversity
