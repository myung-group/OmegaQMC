# rs01 Cassella-style minimal envelope: n_virt_pw = 0 (occupied HF PWs only).
# Architecture: FN + cusp + Smith DJ (periodic) + full-det 16, NO coord BF.
# Hypothesis: smaller envelope basis = less random-init kinetic noise, easier
# optimization at high density.  Direct comparison to rs01_n26_ferminet_djbf_pw200.
# Runs on mango LOGIN NODE (nohup), SR+SPRING+2048w.

project: rs01_n26_ferminet_djbf_pw0

system:
  dim: 2
  rs: 1.0
  N: 26
  polarization: unpolarized

ansatz:
  type: nn_heg
  backbone: ferminet
  embedding_dim: 256
  layers: 4
  two_particle_dim: 32
  n_det: 16
  full_determinant: true
  use_cusp: true
  cusp_trainable_alpha: false
  pair_jastrow: false
  deep_jastrow: false
  use_smith_deep_jastrow: true
  smith_jastrow_hidden: 32
  smith_jastrow_n_layers: 4
  use_backflow: true
  use_coord_backflow: false
  use_ghost_atom: false
  envelope_type: plane_wave
  n_virt_pw: 0
  det_jitter: 0.04
  walker_init: uniform

pretrain:
  iters: 0

optimize:
  type: sr
  iters: 15000
  walkers: 2048
  lr: 1.0
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_T_max: 15000
  lr_n_restarts: 0
  spring_mu: 0.9
  spring_norm_clip: 0.1
  damping_adapt: false
  sampler: metropolis
  var_weight: 0.0
  mcmc_decorr_steps: 60
  mc_timestep: 0.005
  sr_damping: 1.0e-3
  sr_n_cg: 20
  save_every: 500

eval:
  walkers: 1024
  blocks: 50
  equil_blocks: 30
  steps_per_block: 30

observables:
  enabled: true
  triangular_shells: 4
  cartesian_n_max: 6
  n_walkers: 1024
  equil_steps: 600
  sample_steps: 200
  decorr_steps: 5

twist:
  n_twists: 0

ewald:
  n_real: 3
  n_recip: 6
