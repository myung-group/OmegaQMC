# KFAC continuation of rs20_n26_ferminet_cassella, replacing SR with
# FermiNet-faithful KFAC.  Tests whether KFAC's block-diagonal Fisher
# approximation breaks through the -46.1 mHa SR plateau (hypothesis:
# SR's empirical F is rank-deficient at 1024 walkers vs 2.2M params,
# so its natural gradient direction is biased).
#
# Loads from the Cassella parent chkpt (~iter 3899, E=-46.085 mHa).
# Architecture identical → straight resume.
#
# KFAC recipe from project_kfac_ferminet_recipe.md.

project: rs20_n26_ferminet_cassella_kfac

system:
  dim: 2
  rs: 20.0
  N: 26
  polarization: unpolarized

ansatz:
  type: nn_heg
  backbone: ferminet
  embedding_dim: 256
  layers: 4
  two_particle_dim: 32
  n_det: 16
  full_determinant: true
  use_cusp: true
  cusp_trainable_alpha: false
  pair_jastrow: false
  deep_jastrow: false
  use_smith_deep_jastrow: false
  use_backflow: true
  use_coord_backflow: false
  use_ghost_atom: false
  envelope_type: plane_wave
  n_virt_pw: 52
  det_jitter: 0.04
  walker_init: crystal_perturbed

pretrain:
  iters: 0

optimize:
  type: kfac
  iters: 15000
  walkers: 1024
  load_chkpt: runs/rs20_n26_ferminet_cassella/rs20_n26_ferminet_cassella.chk.h5
  lr: 0.05                             # FermiNet's lr
  lr_decay: 1.0e3                      # lr_t = lr / (1 + t/lr_decay)
  kfac_damping: 1.0e-3
  kfac_damping_adapt: true
  kfac_damping_decay: 0.9
  kfac_damping_lookback: 5
  kfac_damping_min: 1.0e-5
  kfac_damping_max: 1.0e3
  kfac_norm_constraint: 1.0e-3
  kfac_capture_activations: false
  kfac_fixed_scale: false
  sampler: metropolis
  var_weight: 0.0
  mcmc_decorr_steps: 30
  mc_timestep: 0.1
  save_every: 500

eval:
  walkers: 1024
  blocks: 50
  equil_blocks: 30
  steps_per_block: 30

observables:
  enabled: true
  triangular_shells: 4
  cartesian_n_max: 6
  n_walkers: 1024
  equil_steps: 600
  sample_steps: 200
  decorr_steps: 5

twist:
  n_twists: 0

ewald:
  n_real: 3
  n_recip: 6
