# rs05 KFAC continuation from SR+SPRING checkpoint at iter ~750 (E/N=-143.7 mHa).
# SR+SPRING plateaued; switching to KFAC capture-activations mode + 2048 walkers.
# Architecture identical to source (rs05_n26_ferminet_djbf): FN + cusp + Smith DJ (periodic) + full-det 16, no coord BF.
# Submitted via SLURM to mango node3 (--time=16-16:00:00).

project: rs05_n26_ferminet_djbf_kfac

system:
  dim: 2
  rs: 5.0
  N: 26
  polarization: unpolarized

ansatz:
  type: nn_heg
  backbone: ferminet
  embedding_dim: 256
  layers: 4
  two_particle_dim: 32
  n_det: 16
  full_determinant: true
  use_cusp: true
  cusp_trainable_alpha: false
  pair_jastrow: false
  deep_jastrow: false
  use_smith_deep_jastrow: true
  smith_jastrow_hidden: 32
  smith_jastrow_n_layers: 4
  use_backflow: true
  use_coord_backflow: false
  use_ghost_atom: false
  envelope_type: plane_wave
  n_virt_pw: 52
  det_jitter: 0.04
  walker_init: crystal_perturbed

pretrain:
  iters: 0

optimize:
  type: kfac
  iters: 50000
  walkers: 2048
  load_chkpt: runs/rs05_n26_ferminet_djbf/rs05_n26_ferminet_djbf.chk.h5
  lr: 0.005
  lr_decay: 1.0e3
  kfac_damping: 0.1
  kfac_damping_adapt: true
  kfac_damping_decay: 0.9
  kfac_damping_lookback: 5
  kfac_damping_min: 1.0e-5
  kfac_damping_max: 1.0e3
  kfac_norm_constraint: 1.0e-4
  kfac_capture_activations: true
  kfac_fixed_scale: false
  kfac_ema_decay: 0.95
  sampler: metropolis
  var_weight: 0.0
  mcmc_decorr_steps: 60
  mc_timestep: 0.025
  save_every: 500

eval:
  walkers: 1024
  blocks: 50
  equil_blocks: 30
  steps_per_block: 30

observables:
  enabled: true
  triangular_shells: 4
  cartesian_n_max: 6
  n_walkers: 1024
  equil_steps: 600
  sample_steps: 200
  decorr_steps: 5

twist:
  n_twists: 0

ewald:
  n_real: 3
  n_recip: 6
