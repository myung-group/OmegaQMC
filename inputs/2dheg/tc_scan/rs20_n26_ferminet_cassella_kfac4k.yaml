# KFAC continuation of rs20_n26_ferminet_cassella with 4000 walkers
# (4x parent's 1024) on mango GH200 96GB.
#
# Tests:
#   - The walker_init=crystal_perturbed fix (5a95f91) gives correct
#     iter-1 energy near the chkpt's -46.085 mHa (was -32 before fix)
#   - 4x walkers improves F-matrix rank for KFAC (Fisher quality)
#   - KFAC vs SR+SPRING comparison at near-converged params
#
# Architecture matches rs20_n26_ferminet_cassella_spring exactly so the
# resulting numbers are directly comparable.
#
# KFAC recipe: SPRING-analogous via Fisher EMA + norm_constraint trust
# region.  Conservative initial lr and damping for warm start (lr=0.005
# with damping=0.1 and norm_constraint=1e-4 proven to keep iter-1 step
# bounded so loaded chkpt isn't wiped).
#
# Memory budget at W=4000, P=2.22M:
#   per-walker pytree grad: 4000 x 2.22M x 8 bytes = 70 GB
#   plus model + activations + workspace  ~10 GB
#   total ~80 GB on 96 GB GH200 (~15 GB headroom)

project: rs20_n26_ferminet_cassella_kfac4k

system:
  dim: 2
  rs: 20.0
  N: 26
  polarization: unpolarized

ansatz:
  type: nn_heg
  backbone: ferminet
  embedding_dim: 256
  layers: 4
  two_particle_dim: 32
  n_det: 16
  full_determinant: true
  use_cusp: true
  cusp_trainable_alpha: false
  pair_jastrow: false
  deep_jastrow: false
  use_smith_deep_jastrow: false
  use_backflow: true
  use_coord_backflow: false
  use_ghost_atom: false
  envelope_type: plane_wave
  n_virt_pw: 52
  det_jitter: 0.04
  walker_init: crystal_perturbed       # honoured now (post-5a95f91 fix)

pretrain:
  iters: 0

optimize:
  type: kfac
  iters: 15000
  walkers: 4000                        # 4x parent's 1024
  load_chkpt: runs/rs20_n26_ferminet_cassella/rs20_n26_ferminet_cassella.chk.h5
  lr: 0.005                            # warm-start conservative (proven)
  lr_decay: 1.0e3                      # lr_t = lr / (1 + t/lr_decay)
  kfac_damping: 0.1
  kfac_damping_adapt: true             # LM ratio rule
  kfac_damping_decay: 0.9
  kfac_damping_lookback: 5
  kfac_damping_min: 1.0e-5
  kfac_damping_max: 1.0e3
  kfac_norm_constraint: 1.0e-4         # trust region cap (SPRING-analogous)
  kfac_capture_activations: false      # M^T M mode (capture path broken on edge Linears)
  kfac_fixed_scale: false
  kfac_ema_decay: 0.95                 # Fisher moving average (SPRING-analogous to spring_mu)
  sampler: metropolis
  var_weight: 0.0
  mcmc_decorr_steps: 60                # 2x parent's 30 (per user)
  mc_timestep: 0.1
  save_every: 500

eval:
  walkers: 1024
  blocks: 50
  equil_blocks: 30
  steps_per_block: 30

observables:
  enabled: true
  triangular_shells: 4
  cartesian_n_max: 6
  n_walkers: 1024
  equil_steps: 600
  sample_steps: 200
  decorr_steps: 5

twist:
  n_twists: 0

ewald:
  n_real: 3
  n_recip: 6
