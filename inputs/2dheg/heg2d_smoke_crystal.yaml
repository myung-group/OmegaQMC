# Smoke test: 2D Wigner crystal pipeline end-to-end on CPU.
# rs=30, N=8 (4/spin closed shell), few iterations.

project: heg2d_smoke_crystal

system:
  dim: 2
  rs: 30.0
  N: 10                       # 5/spin closed shell (also works for
                              # the crystal envelope's site count)
  polarization: unpolarized

ansatz:
  type: psiformer
  embedding_dim: 16
  layers: 1
  heads: 2
  two_particle_dim: 8
  n_det: 2
  use_cusp: false
  deep_jastrow: false
  pair_jastrow: false
  use_ghost_atom: true
  envelope_type: crystal_gaussian
  crystal_sigma_init: 0.3
  crystal_spin_pattern: neel
  crystal_det_jitter: 0.05

pretrain:
  iters: 0                    # crystal doesn't pretrain to plane-wave HF

optimize:
  type: sr
  iters: 30
  walkers: 64
  lr: 0.05
  var_weight: 0.0
  mcmc_decorr_steps: 10
  mc_timestep: 0.05
  sr_damping: 1.0e-3
  sr_n_cg: 10

eval:
  walkers: 64
  blocks: 5
  equil_blocks: 2
  steps_per_block: 5

twist:
  n_twists: 0

ewald:
  n_real: 3
  n_recip: 6
