# Fix A: 2D HEG Wigner-crystal sector @ rs=20, N=18 unpolarized.
# 18 sites = 3x3x2 super-cell of triangular Bravais lattice (commensurate).
# Compare with heg2d_rs20_N18_unpol_fluid_v2.yaml at same rs.

project: heg2d_rs20_N18_unpol_crystal_v2

system:
  dim: 2
  rs: 20.0
  N: 18
  polarization: unpolarized

ansatz:
  type: psiformer
  embedding_dim: 32
  layers: 2
  heads: 2
  two_particle_dim: 16
  n_det: 4
  full_determinant: false
  use_cusp: true
  deep_jastrow: true
  pair_jastrow: false
  jas_activation: tanh
  jas_zero_init_last: true
  envelope_type: crystal_gaussian
  crystal_sigma_init: 0.15           # narrower Gaussians (vs 0.25) -- proper WC localization at low density
  crystal_spin_pattern: neel
  crystal_det_jitter: 0.05
  use_ghost_atom: true

pretrain:
  iters: 0                           # no pretrain (crystal envelope IS the localized HF target)

optimize:
  type: sr
  iters: 2000
  walkers: 512
  lr: 0.05
  var_weight: 0.0
  mcmc_decorr_steps: 30
  mc_timestep: 0.05                  # smaller for localized walkers
  sr_damping: 1.0e-3
  sr_n_cg: 20

eval:
  walkers: 512
  blocks: 40
  equil_blocks: 10
  steps_per_block: 20

twist:
  n_twists: 0

ewald:
  n_real: 4
  n_recip: 8
