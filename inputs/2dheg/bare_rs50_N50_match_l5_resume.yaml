# Resume bare_rs50_N50_match_l5 (vanilla SR, 200 iters → 200 more)
# Loads chkpt from the previous run dir; writes to a new run dir.

project: bare_rs50_N50_match_l5_resume

system:
  dim: 2
  rs: 50.0
  N: 50
  polarization: unpolarized

ansatz:
  type: nn_heg
  backbone: ferminet
  embedding_dim: 32
  layers: 1
  two_particle_dim: 8
  n_det: 2
  full_determinant: true
  use_cusp: true
  cusp_trainable_alpha: false
  use_backflow: true
  use_coord_backflow: false
  pair_jastrow: false
  deep_jastrow: false
  use_smith_deep_jastrow: false
  use_ghost_atom: false
  envelope_type: plane_wave
  n_virt_pw: 1
  det_jitter: 0.04
  walker_init: crystal_perturbed

pretrain:
  iters: 0

optimize:
  type: sr
  load_chkpt: runs/bare_rs50_N50_match_l5/bare_rs50_N50_match_l5.chk.h5
  iters: 200                # additional 200 iters on top of saved state
  walkers: 1024
  lr: 1.0
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_T_max: 200
  spring_mu: 0.0
  spring_norm_clip: 0.0
  damping_adapt: false
  sampler: metropolis
  var_weight: 0.0
  mcmc_decorr_steps: 15
  mc_timestep: 0.1
  sr_damping: 1.0e-3
  sr_n_cg: 20
  save_every: 200

eval:
  walkers: 1024
  blocks: 20
  equil_blocks: 5
  steps_per_block: 10

observables:
  enabled: true
  triangular_shells: 2
  cartesian_n_max: 4
  n_walkers: 1024
  equil_steps: 200
  sample_steps: 200
  decorr_steps: 5

twist:
  n_twists: 0

ewald:
  n_real: 2
  n_recip: 4

seed: 3366247121
