# N=50 Wigner-crystal sector at rs=50 — light "proper" ansatz.
# Companion to heg2d_rs50_N50_unpol_fluid.yaml.
#
# N=50 is the smallest size with a clean 5x5x2 triangular super-cell —
# no missing/gap sites in the lattice (unlike N=18).
#
# Same module + cusp + walker setup as the fluid; only envelope is
# crystal_gaussian.

project: heg2d_rs50_N50_unpol_crystal

system:
  dim: 2
  rs: 50.0
  N: 50
  polarization: unpolarized

ansatz:
  type: psiformer
  embedding_dim: 16
  layers: 1
  heads: 2
  two_particle_dim: 8
  n_det: 1
  full_determinant: false
  use_cusp: true
  deep_jastrow: false
  pair_jastrow: false
  use_backflow: false
  use_ghost_atom: false
  envelope_type: crystal_gaussian
  crystal_sigma_init: 0.10           # narrow Gaussians for low-density localization
  crystal_spin_pattern: neel
  crystal_det_jitter: 0.0

pretrain:
  iters: 0

optimize:
  type: sr
  iters: 300
  walkers: 256
  lr: 0.05
  var_weight: 0.0
  mcmc_decorr_steps: 30
  mc_timestep: 0.05                  # smaller for localized walkers
  sr_damping: 1.0e-3
  sr_n_cg: 15

eval:
  walkers: 256
  blocks: 30
  equil_blocks: 15
  steps_per_block: 20
  mc_timestep: 5.0                   # large eval step (sigma~9.5 Bohr peak width)

observables:
  enabled: true
  triangular_shells: 2
  cartesian_n_max: 6
  n_walkers: 256
  equil_steps: 200
  sample_steps: 80
  decorr_steps: 5

twist:
  n_twists: 0

ewald:
  n_real: 4
  n_recip: 8
