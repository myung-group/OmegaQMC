# N=50 fluid sector @ rs=50 — LIGHT PsiFormer ansatz with backflow + Jastrow.
# Reduced model size for fast turnaround (~5-7 min on A100):
#   embedding_dim   64 -> 32
#   layers          2  -> 1
#   two_particle    32 -> 16
#   n_det           4  -> 2
#   walkers         512 -> 256
# Keeps backflow + deep_jastrow + cusp + ghost ON for fair comparison
# with the previously-tested heavier model.
# Companion: heg2d_rs50_N50_unpol_crystal_lite.yaml

project: heg2d_rs50_N50_unpol_fluid_lite

system:
  dim: 2
  rs: 50.0
  N: 50
  polarization: unpolarized

ansatz:
  type: psiformer
  embedding_dim: 32
  layers: 1
  heads: 2
  two_particle_dim: 16
  n_det: 2
  full_determinant: false
  use_cusp: true
  deep_jastrow: true
  pair_jastrow: false
  jas_activation: tanh
  jas_zero_init_last: true
  use_backflow: true
  use_ghost_atom: true
  envelope_type: plane_wave
  n_virt_pw: 8
  det_jitter: 0.05

pretrain:
  iters: 100
  walkers: 256
  lr: 3.0e-3

optimize:
  type: sr
  iters: 2000
  walkers: 256
  lr: 0.05
  var_weight: 0.0
  mcmc_decorr_steps: 30
  mc_timestep: 0.1
  sr_damping: 1.0e-3
  sr_n_cg: 15

eval:
  walkers: 256
  blocks: 30
  equil_blocks: 10
  steps_per_block: 20

observables:
  enabled: true
  triangular_shells: 2
  cartesian_n_max: 6
  n_walkers: 256
  equil_steps: 200
  sample_steps: 80
  decorr_steps: 5

twist:
  n_twists: 0

ewald:
  n_real: 4
  n_recip: 8
