# =====================================================================
# Phase 2p step 2: CH3· under sigma+/sigma- chiral cavity.
#
# Template — project, lambda, chiral_handedness are overridden by the
# scan driver per grid point. Cavity propagation along z (perpendicular
# to molecular plane), polarization rotating in xy (in plane of nuclei).
#
# Same training budget as vacuum gate (2000 iters, lr=0.02) so the
# baseline VMC quality is consistent across the scan and cavity-induced
# shifts ΔE(λ) and <L_z>(λ) are clean.
# =====================================================================

project: PROJECT_OVERRIDE

seed: 42

system:
  type: ch3
  r_ch_bohr: 2.039

cavity:
  omega: 0.5
  lambda: LAMBDA_OVERRIDE
  polarization:   [1.0, 0.0, 0.0]
  polarization_y: [0.0, 1.0, 0.0]
  chiral_handedness: HAND_OVERRIDE

ansatz:
  type: OmegaQMC/psi/nn/conf/ferminet_jastrow_complex.yaml

optimizer:
  arch: tang_native
  complex_psi: true
  alpha_init: 0.0
  alpha_train: false
  nph_max: 4

  train:
    num_iters: 2000
    num_walkers: 256
    num_steps_per_block: 30
    num_blocks_equil: 5
    num_steps_decorr: 5
    mc_timestep: 0.1
    lr: 0.02
    damping: 1e-3
    cg_maxiter: 100
    max_param_change: 0.2
    jac_batch_size: 64
    verbose: 1

  eval:
    enabled: true
    num_walkers: 512
    num_steps_per_block: 30
    num_blocks: 30
    num_blocks_equil: 10
    mc_timestep: 0.1
    verbose: 0
