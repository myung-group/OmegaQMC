# =====================================================================
# 2D HEG PsiFormer — production benchmark @ rs=2, N=58, unpolarized
#
# Goal:  reproduce Attaccalite (PRL 2002) FN-DMC backflow value
#        E/N = -0.25721(3) Ha/electron to within ~1 mHa/electron.
#
# Run:   python scripts/run_heg_psiformer.py inputs/2dheg/heg2d_rs2_N58_unpol.yaml
# =====================================================================

project: heg2d_rs2_N58_unpol

system:
  dim: 2                               # 2D HEG
  rs: 2.0
  N: 58                                # closed-shell unpolarized (29 per spin)
  polarization: unpolarized

ansatz:
  type: psiformer
  embedding_dim: 64
  layers: 2
  heads: 2
  two_particle_dim: 32
  n_det: 8
  full_determinant: false
  use_cusp: true
  deep_jastrow: true
  pair_jastrow: false
  jas_activation: tanh
  jas_bias: true
  jas_zero_init_last: true
  # 2D closed-shell sequence: 1, 5, 9, 13, 21, 25, 29, 37, 45, 57, ...
  # n_virt_pw should reach the next-shell.  At n=29 the next shell is
  # 8 vectors (|n|^2 = 10), so n_virt_pw=8 covers it.
  n_virt_pw: 8
  det_jitter: 0.02
  use_ghost_atom: true

pretrain:
  iters: 300
  walkers: 512
  lr: 3.0e-3

optimize:
  type: sr
  iters: 8000
  walkers: 2048
  lr: 0.05
  var_weight: 0.01
  mcmc_decorr_steps: 20
  mc_timestep: 0.1
  sr_damping: 1.0e-3
  sr_n_cg: 30

eval:
  walkers: 2048
  blocks: 80
  equil_blocks: 20
  steps_per_block: 30

twist:
  n_twists: 0   # set 8-16 once Gamma converged for a TABC follow-up

ewald:
  n_real: 4
  n_recip: 8
