# Production run A: Smith architecture + VANILLA SR + Metropolis.
# Single-GPU (frodo GPU 1).  Companion to rs20_n50_smith_arch_spring.yaml
# which uses Smith-style optimizer (SPRING+MALA+adaptive damping).
#
# Same architecture, same lr / cosine schedule, same walker count —
# only the optimizer recipe differs.  Direct apples-to-apples test of
# whether Smith's optimizer recipe converges faster / lower than
# vanilla SR at the same compute budget.

project: rs20_n50_smith_arch_vanilla

system:
  dim: 2
  rs: 20.0
  N: 50
  polarization: unpolarized

ansatz:
  type: nn_heg
  backbone: mpnqs
  mpnqs_d1: 32
  mpnqs_d2: 26
  mpnqs_hidden: 32
  mpnqs_n_layers: 4
  n_det: 1
  full_determinant: false
  use_cusp: true
  cusp_trainable_alpha: false
  pair_jastrow: false
  deep_jastrow: false
  use_smith_deep_jastrow: true
  smith_jastrow_hidden: 32
  smith_jastrow_n_layers: 4
  use_backflow: false
  use_coord_backflow: true
  coord_bf_zero_init: true
  use_ghost_atom: false
  envelope_type: plane_wave
  n_virt_pw: 143
  det_jitter: 0.05
  walker_init: crystal_perturbed

pretrain:
  iters: 0

optimize:
  type: sr
  iters: 30000
  walkers: 512                       # single A100 fit (1024 OOMs at ~91 GiB)
  lr: 0.05
  lr_schedule: cosine
  lr_min: 5.0e-5
  lr_T_max: 30000
  lr_n_restarts: 0
  spring_mu: 0.0                    # vanilla SR
  spring_norm_clip: 0
  damping_adapt: false
  sampler: metropolis               # plain Metropolis
  var_weight: 0.0
  mcmc_decorr_steps: 30
  mc_timestep: 0.1
  sr_damping: 1.0e-3
  sr_n_cg: 20
  save_every: 500

eval:
  walkers: 512
  blocks: 50
  equil_blocks: 30
  steps_per_block: 30

observables:
  enabled: true
  triangular_shells: 4
  cartesian_n_max: 6
  n_walkers: 512
  equil_steps: 600
  sample_steps: 200
  decorr_steps: 5

twist:
  n_twists: 0

ewald:
  n_real: 4
  n_recip: 8
