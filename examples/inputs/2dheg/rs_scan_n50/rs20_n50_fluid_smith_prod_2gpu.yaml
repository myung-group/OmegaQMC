# Smith-spec PRODUCTION run on frodo 2x A100 (GPUs 1+2).
# 50k iters, walkers split across both devices (sharding).
#
# Architecture: matches Smith (MP-NQS d1=32, d2=26, hidden=32, T=4
# layers, n_det=1 single Slater, N_k=3N=168 plane waves/orbital).
# ~50k params (matches Smith's claimed count).
#
# Optimizer: vanilla SR + cosine annealing + Metropolis + locked cusp.
# We deliberately do NOT use Smith's lr=10 + SPRING + MALA stack
# because it produced a variational catastrophe (cusp drift + bias
# amplification) in our earlier runs.  Vanilla SR is slower per step
# but rock-solid stable.  Cosine 0.05 → 5e-5 over 50k iters gives
# ample late-stage refinement.
#
# Walker init at WC positions (Smith protocol).

project: rs20_n50_fluid_smith_prod_2gpu

system:
  dim: 2
  rs: 20.0
  N: 50
  polarization: unpolarized

ansatz:
  type: nn_heg
  backbone: mpnqs
  mpnqs_d1: 32                      # Smith
  mpnqs_d2: 26                      # Smith
  mpnqs_hidden: 32                  # Smith
  mpnqs_n_layers: 4                 # Smith T (inferred default)
  n_det: 1                          # Smith (single Slater)
  full_determinant: false
  use_cusp: true
  cusp_trainable_alpha: false       # locked at Kato slope (the lesson)
  pair_jastrow: false
  deep_jastrow: false
  use_smith_deep_jastrow: true      # Smith eqs. 20-21
  smith_jastrow_hidden: 32          # Smith hidden
  smith_jastrow_n_layers: 4         # Smith L=4
  use_backflow: false
  use_coord_backflow: true          # Smith eq. 19
  coord_bf_zero_init: true
  use_ghost_atom: false
  envelope_type: plane_wave
  n_virt_pw: 143                    # N_k = 25 + 143 = 168 ≈ 3N
  det_jitter: 0.05
  walker_init: crystal_perturbed

pretrain:
  iters: 0                          # cold start (Smith protocol)

optimize:
  type: sr
  iters: 50000
  walkers: 1024                     # Smith count (512/GPU on 2 devices)
  lr: 0.05                          # standard vanilla SR lr
  lr_schedule: cosine
  lr_min: 5.0e-5                    # 1000x decay over the run
  lr_T_max: 50000
  lr_n_restarts: 0
  spring_mu: 0.0                    # vanilla SR (no momentum)
  spring_norm_clip: 0               # no F-norm clip
  damping_adapt: false
  sampler: metropolis               # vanilla Metropolis (no MALA)
  var_weight: 0.0
  mcmc_decorr_steps: 30
  mc_timestep: 0.1
  sr_damping: 1.0e-3
  sr_n_cg: 20                       # ignored (SMW is used)
  save_every: 500

eval:
  walkers: 1024
  blocks: 50
  equil_blocks: 30
  steps_per_block: 30

observables:
  enabled: true
  triangular_shells: 4
  cartesian_n_max: 6
  n_walkers: 1024
  equil_steps: 600
  sample_steps: 200
  decorr_steps: 5

twist:
  n_twists: 0

ewald:
  n_real: 4
  n_recip: 8
