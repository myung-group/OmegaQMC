# Production run B: Smith architecture + SPRING optimizer + MALA sampler.
# Single-GPU (frodo GPU 2).  Companion to rs20_n50_smith_arch_vanilla.yaml.
#
# Same architecture, same lr / cosine schedule, same walker count —
# only the optimizer recipe differs.  This run uses the full
# Smith-style stack (SPRING momentum + F-norm clip + adaptive damping
# + MALA + lr decay).
#
# IMPORTANT: lr is moderated to 0.05 (not Smith's 10) because the
# previous lr=10 + SPRING run hit a variational catastrophe.  Even at
# lr=0.05 with SPRING+MALA the bouncing pattern was visible in our
# earlier runs.  This is the apples-to-apples comparison run; if
# vanilla outperforms, that's strong evidence for our setup.

project: rs20_n50_smith_arch_spring

system:
  dim: 2
  rs: 20.0
  N: 50
  polarization: unpolarized

ansatz:
  type: nn_heg
  backbone: mpnqs
  mpnqs_d1: 32
  mpnqs_d2: 26
  mpnqs_hidden: 32
  mpnqs_n_layers: 4
  n_det: 1
  full_determinant: false
  use_cusp: true
  cusp_trainable_alpha: false
  pair_jastrow: false
  deep_jastrow: false
  use_smith_deep_jastrow: true
  smith_jastrow_hidden: 32
  smith_jastrow_n_layers: 4
  use_backflow: false
  use_coord_backflow: true
  coord_bf_zero_init: true
  use_ghost_atom: false
  envelope_type: plane_wave
  n_virt_pw: 143
  det_jitter: 0.05
  walker_init: crystal_perturbed

pretrain:
  iters: 0

optimize:
  type: sr
  iters: 30000
  walkers: 1024                      # 2-GPU sharded (~45 GiB/GPU)
  lr: 0.05                           # SAME as vanilla for fair comparison
  lr_schedule: inverse               # Smith-style decay
  lr_decay_T: 1000                   # Smith T
  spring_mu: 0.9                     # Smith momentum
  spring_norm_clip: 0.05             # C = lr (Smith convention)
  damping_adapt: true                # Smith adaptive λ
  damping_min: 1.0e-5
  damping_max: 1.0e-1
  damping_factor: 2.0
  damping_lookback: 100
  sampler: mala                      # Smith MALA sampler
  mala_grad_clip: 1.0
  var_weight: 0.0
  mcmc_decorr_steps: 20              # Smith mcmc count
  mc_timestep: 0.1
  sr_damping: 1.0e-3                 # Smith λ
  sr_n_cg: 20
  save_every: 500

eval:
  walkers: 1024
  blocks: 50
  equil_blocks: 30
  steps_per_block: 30

observables:
  enabled: true
  triangular_shells: 4
  cartesian_n_max: 6
  n_walkers: 1024
  equil_steps: 600
  sample_steps: 200
  decorr_steps: 5

twist:
  n_twists: 0

ewald:
  n_real: 4
  n_recip: 8
