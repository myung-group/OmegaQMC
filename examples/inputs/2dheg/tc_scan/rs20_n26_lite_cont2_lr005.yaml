# Second continuation of rs20_n26_lite at N=26.
# History:
#   rs20_n26_lite           : cold start, lr=0.05, plateaued at -44.62 mHa
#   rs20_n26_lite_cont_lr01 : warm restart from above, lr=0.1, ended at -44.97 mHa
#   rs20_n26_lite_cont2     : warm restart from above, lr=0.05, 50k iters refinement (THIS)
#
# Strategy: anneal at lower lr now that we're in a better basin.
# Same lite architecture. Vanilla SR + Metropolis. mango GH200.

project: rs20_n26_lite_cont2_lr005

system:
  dim: 2
  rs: 20.0
  N: 26
  polarization: unpolarized

ansatz:
  type: nn_heg
  backbone: mpnqs
  mpnqs_d1: 24
  mpnqs_d2: 16
  mpnqs_hidden: 24
  mpnqs_n_layers: 3
  mpnqs_use_layer_norm: false
  n_det: 1
  full_determinant: false
  use_cusp: true
  cusp_trainable_alpha: false
  pair_jastrow: false
  deep_jastrow: false
  use_smith_deep_jastrow: true
  smith_jastrow_hidden: 24
  smith_jastrow_n_layers: 3
  use_backflow: false
  use_coord_backflow: true
  coord_bf_zero_init: true
  use_ghost_atom: false
  envelope_type: plane_wave
  n_virt_pw: 65
  det_jitter: 0.05
  walker_init: crystal_perturbed

pretrain:
  iters: 0

optimize:
  type: sr
  iters: 50000
  walkers: 1024
  load_chkpt: runs/rs20_n26_lite_cont_lr01/rs20_n26_lite_cont_lr01.chk.h5
  lr: 0.05
  lr_schedule: cosine
  lr_min: 5.0e-5
  lr_T_max: 50000
  lr_n_restarts: 0           # clean cosine anneal, no SGDR
  spring_mu: 0.0
  spring_norm_clip: 0
  damping_adapt: false
  sampler: metropolis
  var_weight: 0.0
  mcmc_decorr_steps: 30
  mc_timestep: 0.1
  sr_damping: 1.0e-3
  sr_n_cg: 20
  save_every: 500

eval:
  walkers: 1024
  blocks: 50
  equil_blocks: 30
  steps_per_block: 30

observables:
  enabled: false

twist:
  n_twists: 0

ewald:
  n_real: 3
  n_recip: 6
