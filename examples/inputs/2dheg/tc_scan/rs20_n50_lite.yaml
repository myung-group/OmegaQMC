# TC 1989 reproduction scan, Phase 1: N=50, rs=20 unpolarized fluid.
#
# N=50 unpolarized closed shell on square cell:
#   shells through |k|² = 8 cumulative gives 25 spatial states/spin
#   1+4+4+4+8+4 = 25
#
# N_k = 3N = 150 per orbital → n_virt_pw = 150 - 25 = 125
#
# TC 1989 doesn't tabulate N=50 directly (their table uses N=42, 58),
# but their VMC values are flat across N=26-114 (within 0.05 mHa) so
# we expect ~-45.85 mHa for VMC at this scale.
# Our recipe (validated A) targets DMC accuracy: ~-46.34 mHa.

project: rs20_n50_lite

system:
  dim: 2
  rs: 20.0
  N: 50
  polarization: unpolarized

ansatz:
  type: nn_heg
  backbone: mpnqs
  mpnqs_d1: 24
  mpnqs_d2: 16
  mpnqs_hidden: 24
  mpnqs_n_layers: 3
  mpnqs_use_layer_norm: false
  n_det: 1
  full_determinant: false
  use_cusp: true
  cusp_trainable_alpha: false
  pair_jastrow: false
  deep_jastrow: false
  use_smith_deep_jastrow: true
  smith_jastrow_hidden: 24
  smith_jastrow_n_layers: 3
  use_backflow: false
  use_coord_backflow: true
  coord_bf_zero_init: true
  use_ghost_atom: false
  envelope_type: plane_wave
  n_virt_pw: 125
  det_jitter: 0.05
  walker_init: crystal_perturbed

pretrain:
  iters: 0

optimize:
  type: sr
  iters: 8000
  walkers: 1024
  lr: 0.05
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_T_max: 8000
  lr_n_restarts: 2     # SGDR: 3 cosine cycles to escape local minima at N >= 26
  spring_mu: 0.0
  spring_norm_clip: 0
  damping_adapt: false
  sampler: metropolis
  var_weight: 0.0
  mcmc_decorr_steps: 30
  mc_timestep: 0.1
  sr_damping: 1.0e-3
  sr_n_cg: 20
  save_every: 500

eval:
  walkers: 1024
  blocks: 50
  equil_blocks: 30
  steps_per_block: 30

observables:
  enabled: false

twist:
  n_twists: 0

ewald:
  n_real: 4
  n_recip: 8
