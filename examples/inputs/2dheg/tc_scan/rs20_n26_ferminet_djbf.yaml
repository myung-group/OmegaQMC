# Continuation of rs20_n26_ferminet_cassella with BOTH Smith deep
# Jastrow AND Smith coord backflow added simultaneously.  Sources from
# the same iter-2500 Cassella snapshot used by the *_jastrow run.
#
# Wave function = envelope(r + W_bf·h_i^L)     ← coord BF (NEW)
#                 × (1 + 2·tanh(BF_factor/4))   ← multiplicative BF (existing)
#                 → full-det slogdet
#                 + cusp(r_ij)                   ← Kato cusp (existing)
#                 + smith_deep_jastrow(h_i, r_bf) ← Smith DJ (NEW, sees shifted positions)
#
# Both new modules zero-init their last layer, so wf at iter 0 is
# identical to the Cassella source.  SR drives both modules to
# specialise in tandem.
#
# This is the FULL Smith-style correlation stack on top of FermiNet's
# multi-det + full-det envelope:
#   FermiNet backbone (no attention, sender-spin EdgeSum)
#   + multiplicative BF (FermiNet flavor) + coord BF (Smith flavor)
#   + Smith deep Jastrow + locked Kato cusp
#   + multi-det 16, full_det
#
# Source chkpt: rs20_n26_ferminet_cassella iter 2500, E/N=-46.035 mHa.

project: rs20_n26_ferminet_djbf

system:
  dim: 2
  rs: 20.0
  N: 26
  polarization: unpolarized

ansatz:
  type: nn_heg
  backbone: ferminet
  embedding_dim: 256
  layers: 4
  two_particle_dim: 32
  n_det: 16
  full_determinant: true
  use_cusp: true
  cusp_trainable_alpha: false
  pair_jastrow: false
  deep_jastrow: false
  use_smith_deep_jastrow: true       # Smith eqs. 20-21
  smith_jastrow_hidden: 32
  smith_jastrow_n_layers: 4
  use_backflow: true                 # multiplicative BF (existing in source)
  use_coord_backflow: true           # ← coord BF: x_i = r_i + W_bf · h_i^L
  coord_bf_zero_init: true           # zero-init so iter-0 wf == source
  use_ghost_atom: false
  envelope_type: plane_wave
  n_virt_pw: 52
  det_jitter: 0.04
  walker_init: crystal_perturbed

pretrain:
  iters: 0

optimize:
  type: sr
  iters: 25000
  walkers: 1024
  load_chkpt: runs/rs20_n26_ferminet_cassella_jastrow/source_snapshot.chk.h5
  load_chkpt_partial: true
  # Path-based load: source's config differs from target's only in
  # these flags (target enables them, source does not).  The loader
  # builds a shadow-source pytree from this override to derive the
  # chkpt's leaf paths, then matches by path so leaves don't get
  # misaligned by alphabetical re-ordering.
  load_chkpt_source_overrides:
    use_smith_deep_jastrow: false
    use_coord_backflow: false
  lr: 0.03
  lr_schedule: cosine
  lr_min: 5.0e-5
  lr_T_max: 25000
  lr_n_restarts: 0
  spring_mu: 0.0
  spring_norm_clip: 0
  damping_adapt: false
  sampler: metropolis
  var_weight: 0.0
  mcmc_decorr_steps: 30
  mc_timestep: 0.1
  sr_damping: 1.0e-3
  sr_n_cg: 20
  save_every: 500

eval:
  walkers: 1024
  blocks: 50
  equil_blocks: 30
  steps_per_block: 30

observables:
  enabled: true
  triangular_shells: 4
  cartesian_n_max: 6
  n_walkers: 1024
  equil_steps: 600
  sample_steps: 200
  decorr_steps: 5

twist:
  n_twists: 0

ewald:
  n_real: 3
  n_recip: 6
