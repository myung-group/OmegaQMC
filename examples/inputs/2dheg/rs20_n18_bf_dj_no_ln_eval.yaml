# Eval-only diagnostic: load chkpt of rs20_n18_bf_dj_no_ln (the
# winning A run, eval E/N = -46.46 mHa), skip training, run eval
# phase with observables ON (g(r), S(k), density).
#
# Goal: determine whether the trained wavefunction is in the
# FLUID phase (uniform density, structureless g(r) beyond hole)
# or CRYSTAL/WC phase (sharp Bragg peaks in S(k), localized
# density).
#
# At rs=20, both phases have nearly degenerate energy (DMC gap
# only 0.057 mHa), so phase ID requires structural diagnostics.
#
# WC lattice at rs=20: triangular, lattice constant ~30 Bohr.
# triangular_shells=4 covers the first 4 reciprocal lattice
# shells of the triangular WC.

project: rs20_n18_bf_dj_no_ln_eval

system:
  dim: 2
  rs: 20.0
  N: 18
  polarization: unpolarized

ansatz:
  type: nn_heg
  backbone: mpnqs
  mpnqs_d1: 24
  mpnqs_d2: 16
  mpnqs_hidden: 24
  mpnqs_n_layers: 3
  mpnqs_use_layer_norm: false
  n_det: 1
  full_determinant: false
  use_cusp: true
  cusp_trainable_alpha: false
  pair_jastrow: false
  deep_jastrow: false
  use_smith_deep_jastrow: true
  smith_jastrow_hidden: 24
  smith_jastrow_n_layers: 3
  use_backflow: false
  use_coord_backflow: true
  coord_bf_zero_init: true
  use_ghost_atom: false
  envelope_type: plane_wave
  n_virt_pw: 45
  det_jitter: 0.05
  walker_init: crystal_perturbed

pretrain:
  iters: 0

optimize:
  type: sr
  iters: 0                                                    # SKIP TRAINING
  load_chkpt: runs/rs20_n18_bf_dj_no_ln/rs20_n18_bf_dj_no_ln.chk.h5
  walkers: 1024
  lr: 0.05
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_T_max: 8000
  spring_mu: 0.0
  spring_norm_clip: 0
  damping_adapt: false
  sampler: metropolis
  var_weight: 0.0
  mcmc_decorr_steps: 30
  mc_timestep: 0.1
  sr_damping: 1.0e-3
  sr_n_cg: 20
  save_every: 0

eval:
  walkers: 1024
  blocks: 100                                                  # 2× normal — better statistics
  equil_blocks: 50                                             # generous warmup from chkpt
  steps_per_block: 50

observables:
  enabled: true                                                # THE KEY: compute g(r), S(k), density
  triangular_shells: 4                                         # WC triangular Bragg peaks
  cartesian_n_max: 6                                           # square-cell S(k) grid
  n_walkers: 1024
  equil_steps: 1000
  sample_steps: 500
  decorr_steps: 10

twist:
  n_twists: 0

ewald:
  n_real: 3
  n_recip: 6
