# 2D HEG PsiFormer benchmark @ rs=20, N=58 unpol
# Attaccalite 2002 reference (Ha/elec): see notes/2d_heg_benchmarks.md

project: heg2d_rs20_N58_unpol

system:
  dim: 2
  rs: 20.0
  N: 58
  polarization: unpolarized

ansatz:
  type: psiformer
  embedding_dim: 64
  layers: 2
  heads: 2
  two_particle_dim: 32
  n_det: 8
  full_determinant: false
  use_cusp: true
  deep_jastrow: true
  pair_jastrow: false
  jas_activation: tanh
  jas_bias: true
  jas_zero_init_last: true
  n_virt_pw: 8
  det_jitter: 0.02
  use_ghost_atom: true

pretrain:
  iters: 300
  walkers: 512
  lr: 3.0e-3

optimize:
  type: sr
  iters: 8000
  walkers: 2048
  lr: 0.05
  var_weight: 0.01
  mcmc_decorr_steps: 20
  mc_timestep: 0.1
  sr_damping: 1.0e-3
  sr_n_cg: 30

eval:
  walkers: 2048
  blocks: 80
  equil_blocks: 20
  steps_per_block: 30

twist:
  n_twists: 0

ewald:
  n_real: 4
  n_recip: 8
