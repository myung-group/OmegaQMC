# =====================================================================
# QED-NN-VMC: H2 at λ=0 with Tang-style n-aware ansatz (Phase 2f-1)
#
# Purpose: paired pilot at λ=0 to subtract from h2_lambda_010_naware
# for the differential comparison ΔE(0.1) − ΔE(0). Both runs use the
# n-aware ansatz so basis effects cancel.
#
# QED-FCI reference (STO-6G): E(λ=0) = −1.1459220563 Ha
# Expected: PsiFormer (CBS) ≈ −1.17 Ha, like the factorized λ=0 pilot.
# =====================================================================

project: qed_h2_decoupling_pilot_naware

seed: 42

system:
  type: h2
  R_bohr: 1.4010

cavity:
  omega: 0.5
  lambda: 0.0
  polarization: [0.0, 0.0, 1.0]

ansatz:
  type: psiformer

optimizer:
  n_aware: true            # Phase 2f-1 — Tang-style joint (r, n) ansatz
  fock_hidden_dim: 64
  alpha_init: 0.0          # ignored when n_aware=true
  alpha_train: false
  nph_max: 4

  train:
    num_iters: 100
    num_walkers: 256
    num_steps_per_block: 30
    num_blocks_equil: 5
    num_steps_decorr: 5
    mc_timestep: 0.1
    lr: 0.05
    damping: 1e-3
    cg_maxiter: 100
    max_param_change: 0.5
    jac_batch_size: 64
    verbose: 1

  eval:
    enabled: true
    num_walkers: 512
    num_steps_per_block: 30
    num_blocks: 30
    num_blocks_equil: 10
    mc_timestep: 0.1
    verbose: 0
