# =====================================================================
# QED-NN-VMC: H2 at λ=0 with hybrid envelope + Fock-head ansatz
# (Phase 2f-1 Path B)
#
# Form: log Ψ(r, n) = log Ψ_e(r) + log⟨n|α⟩ + g_θ(n; ε·d_e(r))
#
# Notes on α_init:
#   At α=0 the envelope is δ_{n,0}, locking walkers to vacuum and
#   killing the bilinear-coupling capture. We initialise α=0.1 to
#   seed ~1% photon weight at n=1 so the head's r-correction has
#   gradient signal. SR then refines α.
#   For λ=0 the perturbative α* = 0; we expect SR to push α back
#   toward 0 over training.
# =====================================================================

project: qed_h2_decoupling_pilot_hybrid

seed: 42

system:
  type: h2
  R_bohr: 1.4010

cavity:
  omega: 0.5
  lambda: 0.0
  polarization: [0.0, 0.0, 1.0]

ansatz:
  type: psiformer

optimizer:
  arch: hybrid
  fock_hidden_dim: 64
  alpha_init: 0.1
  alpha_train: true
  nph_max: 4

  train:
    num_iters: 100
    num_walkers: 256
    num_steps_per_block: 30
    num_blocks_equil: 5
    num_steps_decorr: 5
    mc_timestep: 0.1
    lr: 0.05
    damping: 1e-3
    cg_maxiter: 100
    max_param_change: 0.5
    jac_batch_size: 64
    alpha_lr_scale: 2.0
    verbose: 1

  eval:
    enabled: true
    num_walkers: 512
    num_steps_per_block: 30
    num_blocks: 30
    num_blocks_equil: 10
    mc_timestep: 0.1
    verbose: 0
