# =====================================================================
# Phase 2n CHIRAL CAVITY pilot: H2 in sigma+ circularly polarized cavity.
#
# This is the first chiral-cavity test of the complex-Psi pipeline.
# Cavity field is circularly polarized in the (x, y) plane (propagation
# along z, perpendicular to the H2 bond axis along z). H2 has a
# z-symmetric ground state, so a chiral cavity polarized in the
# xy-plane couples to in-plane dipole fluctuations.
#
# Expected: with sigma+ handedness, <L_z> in the GS becomes non-zero
# (inverse Faraday / cavity-induced ring current). For real-Psi this
# would be identically zero; that complex-Psi pipeline gives nonzero
# <L_z> is the headline observable distinction.
#
# Note: H2 chiral pilot is the SMALLEST test of mechanism. Methyl radical
# (open-shell, degenerate p orbital) is the proper chemistry target.
#
# Compute: mango GH200. Per-iter ~0.23s for complex-Psi (2 Jacobians).
# =====================================================================

project: qed_h2_chiral_pilot_sigma_minus

seed: 42

system:
  type: h2
  R_bohr: 1.4010
  spin: singlet

cavity:
  omega: 0.5
  lambda: 0.1
  polarization:   [1.0, 0.0, 0.0]   # eps_x along x (perp to H-H axis)
  polarization_y: [0.0, 1.0, 0.0]   # eps_y along y (perp to H-H axis, perp to eps_x)
  chiral_handedness: -1               # +1 = sigma+, -1 = sigma-

ansatz:
  type: OmegaQMC/psi/nn/conf/ferminet_jastrow_complex.yaml

optimizer:
  arch: tang_native
  complex_psi: true
  alpha_init: 0.0
  alpha_train: false
  nph_max: 4

  train:
    num_iters: 2000
    num_walkers: 256
    num_steps_per_block: 30
    num_blocks_equil: 5
    num_steps_decorr: 5
    mc_timestep: 0.1
    lr: 0.05
    damping: 1e-3
    cg_maxiter: 100
    max_param_change: 0.5
    jac_batch_size: 64
    verbose: 1

  eval:
    enabled: true
    num_walkers: 512
    num_steps_per_block: 30
    num_blocks: 30
    num_blocks_equil: 10
    mc_timestep: 0.1
    verbose: 0
