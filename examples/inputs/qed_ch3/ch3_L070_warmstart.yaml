# CH3 sigma+ at lambda=0.7, warm-started from converged lambda=0.5 sigma+ params.
# Larger basin gap (~2x lambda=0.5) makes basin selection easy; warm-start
# means we land directly in the correct basin from iter 1.
project: qed_ch3_chiral_L070_warm
seed: 42
system:
  type: ch3
  r_ch_bohr: 2.039
cavity:
  omega: 0.5
  lambda: 0.70
  polarization:   [1.0, 0.0, 0.0]
  polarization_y: [0.0, 1.0, 0.0]
  chiral_handedness: 1
ansatz:
  type: OmegaQMC/psi/nn/conf/ferminet_jastrow_complex.yaml
optimizer:
  arch: tang_native
  complex_psi: true
  alpha_init: 0.0
  alpha_train: false
  nph_max: 4
  init_params_path: logs/qed_ch3_chiral_L050_test/qed_ch3_chiral_L050_test.params.pkl
  train: { num_iters: 2000, num_walkers: 256, num_steps_per_block: 30,
           num_blocks_equil: 5, num_steps_decorr: 5, mc_timestep: 0.1,
           lr: 0.01, damping: 1e-3, cg_maxiter: 100,
           max_param_change: 0.1, jac_batch_size: 64, verbose: 1 }
  eval:  { enabled: true, num_walkers: 512, num_steps_per_block: 30,
           num_blocks: 30, num_blocks_equil: 10, mc_timestep: 0.1, verbose: 0 }
