# PauliNet architecture (default)
n_determinants: 16
full_determinant: true
backflow_transform: mult

# Envelope
envelope_isotropic: true
envelope_per_shell: false
envelope_per_orbital_exponent: true
envelope_spin_restricted: false
envelope_init_to_ones: true
envelope_softplus_zeta: false

# Cusp
cusp_electrons: true
cusp_electrons_type: deepqmc
cusp_same_scale: 0.25
cusp_anti_scale: 0.5
cusp_alpha: 10.0
cusp_trainable_alpha: false
cusp_nuclei: false

# OmniNet / GNN
embedding_dim: 128
use_jastrow: true
use_backflow: true
n_interactions: 3
two_particle_stream_dim: 32
self_interaction: false
deep_features: shared
update_rule: concatenate

# MLP defaults (for GNN subnets)
mlp_hidden_layers: [log, 2]
mlp_bias: true
mlp_activation: tanh
mlp_init: default

# G subnet MLP
g_mlp_hidden_layers: [log, 1]
g_mlp_bias: false
g_mlp_last_linear: false
g_mlp_activation: tanh
g_mlp_init: default

# Backflow MLP
bf_mlp_hidden_layers: [log, 1]
bf_mlp_bias: false
bf_mlp_last_linear: true
bf_mlp_activation: null
bf_mlp_init: default

# Jastrow MLP
jas_mlp_hidden_layers: [log, 1]
jas_mlp_bias: false
jas_mlp_last_linear: true
jas_mlp_activation: null
jas_mlp_init: default
jas_sum_first: true

# Conf coeff
conf_coeff: linear

# Edge types
edge_types: [same, anti]

# Ne positional embedding
ne_powers: [1]
ne_log_rescale: false

# Embeddings
use_spin_embedding: false
project_to_embedding_dim: false

# Residual connections
electron_residual_normalize: true
two_particle_residual_normalize: true
nucleus_residual: false

# Update features
update_features:
  - type: residual
  - type: node_sum
    node_types: [up, down]
    normalize: true
  - type: convolution
    edge_types: [same, anti]
    normalize: false
