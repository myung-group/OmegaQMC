# Compact PsiFormer preset for small systems (H2-class).
# ~20-30x fewer parameters than the default psiformer.yaml,
# at the cost of a smaller attention state. Still plenty of
# capacity for 2-electron problems — the reference PsiFormer
# paper shows sub-mHa accuracy on H2/LiH/BeH2 with much
# smaller networks than the Organics sweep.
#
# Changes vs OmegaQMC/psi/nn/conf/psiformer.yaml:
#   embedding_dim        256 -> 64   (16x in quadratic terms)
#   n_interactions       4   -> 2
#   n_determinants       16  -> 4
#   num_heads            4   -> 2
#   two_particle_stream  32  -> 16
# Everything else matches the default PsiFormer preset.

n_determinants: 4
full_determinant: true
backflow_transform: mult

# Envelope
envelope_isotropic: true
envelope_per_shell: false
envelope_per_orbital_exponent: true
envelope_spin_restricted: false
envelope_init_to_ones: true
envelope_softplus_zeta: false

# Cusp
cusp_electrons: true
cusp_electrons_type: psiformer
cusp_same_scale: 0.25
cusp_anti_scale: 0.5
cusp_alpha: 1.0
cusp_trainable_alpha: true
cusp_nuclei: false

# OmniNet / GNN
embedding_dim: 64
use_jastrow: false
use_backflow: true
n_interactions: 2
two_particle_stream_dim: 16
self_interaction: true
deep_features: false
update_rule: concatenate

# MLP defaults
mlp_hidden_layers: [log, 2]
mlp_bias: true
mlp_activation: tanh
mlp_init: ferminet

# Backflow MLP
bf_mlp_hidden_layers: [log, 1]
bf_mlp_bias: false
bf_mlp_last_linear: true
bf_mlp_activation: null
bf_mlp_init: ferminet

# Conf coeff
conf_coeff: sum_pool

edge_types: null

# Ne positional embedding
ne_powers: [1]
ne_log_rescale: true

# Embeddings
use_spin_embedding: true
project_to_embedding_dim: true

# Residual connections
electron_residual_normalize: false
two_particle_residual_normalize: false
nucleus_residual: false

# Attention update features
update_features:
  - type: node_attention
    num_heads: 2
    mlp_hidden_layers: [log, 2]
    mlp_bias: true
    mlp_activation: tanh
    mlp_init: ferminet
    attention_residual_normalize: false
    mlp_residual_normalize: false
